
name: Build Smart File Renamer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -o SmartFileRenamer-Android-Starter.zip
          cp -a SmartFileRenamer/. .
          rm -rf SmartFileRenamer
      - name: Package Android source for download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          with ZipFile("SmartFileRenamer-Source.zip", "w", ZIP_DEFLATED) as z:
              for root in [Path("app"), Path("gradle")]:
                  if root.exists():
                      for p in root.rglob("*"):
                          if p.is_file() and "build" not in p.parts:
                              z.write(p, p.as_posix())

              for name in [
                  "settings.gradle.kts",
                  "build.gradle.kts",
                  "gradle.properties",
                  "gradlew",
                  "gradlew.bat"
              ]:
                  p = Path(name)
                  if p.is_file():
                      z.write(p, p.as_posix())

          print("Android source packaged successfully.")
          PY
      - name: Fix duplicate Kotlin Compose plugin declaration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          if not p.exists():
              raise SystemExit(f"Build file not found: {p}")

          lines = p.read_text().splitlines(keepends=True)
          seen = False
          fixed = []

          for line in lines:
              if "org.jetbrains.kotlin.plugin.compose" in line:
                  if seen:
                      print("Removing duplicate:", line.strip())
                      continue
                  seen = True
              fixed.append(line)

          if not seen:
              raise SystemExit("Compose plugin declaration not found")

          p.write_text("".join(fixed))
          print("Compose plugin declarations checked.")

          PY

      - name: Stabilize background rename worker
        run: |
          sed -i '/import androidx.work.WorkerParameters/a import androidx.work.workDataOf' app/src/main/java/com/example/smartfilerenamer/RenameWorker.kt
          sed -i '/setForeground(foregroundInfo/d' app/src/main/java/com/example/smartfilerenamer/RenameWorker.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
            - name: Upload Android source
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileRenamer-Source
          path: SmartFileRenamer-Source.zip
          if-no-files-found: error
          retention-days: 14
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileRenamer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
                - name: Upload Android source
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileRenamer-Source
          path: SmartFileRenamer-Source.zip
          if-no-files-found: error
          retention-days: 14
