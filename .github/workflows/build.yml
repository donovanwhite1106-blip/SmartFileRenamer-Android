
name: Build Smart File Renamer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project

      - name: Fix duplicate Kotlin Compose plugin declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          lines = p.read_text().splitlines(keepends=True)
          seen = False
          fixed = []

          for line in lines:
              if "org.jetbrains.kotlin.plugin.compose" in line:
                  if seen:
                      continue
                  seen = True
              fixed.append(line)

          p.write_text("".join(fixed))
          print("Compose plugin fix applied")
          PY

        run: |
          unzip -o SmartFileRenamer-Android-Starter.zip
          cp -a SmartFileRenamer/. .
          rm -rf SmartFileRenamer

      - name: Stabilize background rename worker
        run: |
          sed -i '/import androidx.work.WorkerParameters/a import androidx.work.workDataOf' app/src/main/java/com/example/smartfilerenamer/RenameWorker.kt
          sed -i '/setForeground(foregroundInfo/d' app/src/main/java/com/example/smartfilerenamer/RenameWorker.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileRenamer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
